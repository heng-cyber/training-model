[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-ml"
version = "0.1.0"
description = "Train baseline ML models for XAUUSD using MetaTrader 5 market data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XAUUSD ML" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
xauusd-fetch = "xauusd_ml.cli:fetch_main"
xauusd-train = "xauusd_ml.cli:train_main"
xauusd-eval = "xauusd_ml.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
